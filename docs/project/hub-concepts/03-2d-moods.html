<title>Hub 2D Moods</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Hanken+Grotesk:wght@400;600;700&family=IBM+Plex+Mono:wght@500&family=Press+Start+2P&family=Anton&display=swap">
<style>
/* Layout: a short intro, then six labelled frames in a responsive grid. Each frame is a self-contained 2D mood; the page chrome stays quiet so the frames carry the look. */
:root {
  --bg: #f4f2ee; --fg: #16151a; --muted: #5d5a66; --line: #dcd8d0; --card: #ffffff;
  --exposure: #ff4d5e; --resonance: #ffad1f; --altitude: #2fb8ff; --forge: #3ddc84; --infinity: #b07cff;
  --font-display: "Lilita One", system-ui, sans-serif;
  --font-body: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #111015; --fg: #f2f0f5; --muted: #a29fac; --line: #2a2831; --card: #1a1920; } }
:root[data-theme="dark"] { --bg: #111015; --fg: #f2f0f5; --muted: #a29fac; --line: #2a2831; --card: #1a1920; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); line-height: 1.5; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 32px 16px 64px; }
header h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(30px, 5vw, 48px); margin: 0 0 6px; line-height: 1; }
header p { margin: 0; color: var(--muted); max-width: 62ch; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); gap: 20px; margin-top: 28px; }
figure { margin: 0; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.frame { position: relative; aspect-ratio: 16 / 10; overflow: hidden; isolation: isolate; }
figcaption { padding: 12px 14px 14px; display: grid; gap: 2px; }
figcaption b { font-size: 16px; }
figcaption b span { font: 500 12px var(--font-mono); color: var(--muted); margin-right: 6px; }
figcaption small { color: var(--muted); font-size: 14px; }

/* 1 Title screen */
.f1 svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.f1 .drift-a { animation: drift 18s linear infinite alternate; }
.f1 .drift-b { animation: drift 11s linear infinite alternate-reverse; }
.f1 .bob { animation: bob 4s ease-in-out infinite; transform-box: fill-box; }
@keyframes drift { to { transform: translateX(-40px); } }
@keyframes bob { 50% { transform: translateY(-6px); } }
.f1 .logo { position: absolute; left: 0; right: 0; top: 18%; text-align: center; font-family: var(--font-display); font-size: clamp(34px, 7.5cqw, 64px); color: #fff; -webkit-text-stroke: 3px #2a1660; paint-order: stroke fill; text-shadow: 0 5px 0 #2a1660, 0 0 30px rgba(255,220,120,.7); letter-spacing: .02em; line-height: .95; }
.f1 .logo small { display: block; font-size: .32em; color: #ffe27a; -webkit-text-stroke: 2px #2a1660; letter-spacing: .2em; margin-top: 4px; }
.f1 .press { position: absolute; left: 0; right: 0; bottom: 9%; text-align: center; font: 700 13px var(--font-mono); color: #fff; letter-spacing: .3em; text-shadow: 0 2px 0 #2a1660; animation: blink 1.1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.frame { container-type: inline-size; }

/* 2 World select */
.f2 { background: radial-gradient(circle at 50% 120%, #ffd34d 0, #ff7a59 30%, #6c2bd9 75%); display: grid; place-items: center; }
.f2 .top { position: absolute; top: 8%; left: 6%; right: 6%; display: flex; justify-content: space-between; align-items: center; color: #fff; font-family: var(--font-display); font-size: clamp(14px, 4cqw, 24px); text-shadow: 0 2px 0 rgba(0,0,0,.35); }
.f2 .pill { font: 700 11px var(--font-body); background: rgba(0,0,0,.35); border-radius: 999px; padding: 4px 10px; text-shadow: none; }
.f2 .cards { display: flex; gap: 3%; width: 88%; height: 62%; margin-top: 8%; }
.f2 .c { flex: 1; min-width: 0; background: var(--c); border: 3px solid #fff; border-radius: 12px; box-shadow: 0 5px 0 rgba(0,0,0,.3); display: grid; grid-template-rows: 1fr auto auto; padding: 7% 7% 9%; color: #fff; transform: rotate(var(--r)); animation: hop 2.6s ease-in-out infinite; animation-delay: var(--d); position: relative; }
.f2 .c svg { width: 70%; justify-self: center; align-self: center; }
.f2 .c b { font-family: var(--font-display); font-weight: 400; font-size: clamp(9px, 2.5cqw, 16px); text-shadow: 0 2px 0 rgba(0,0,0,.25); text-align: center; }
.f2 .bar { height: 6px; border-radius: 6px; background: rgba(0,0,0,.25); overflow: hidden; margin-top: 4px; }
.f2 .bar i { display: block; height: 100%; width: var(--p); background: #fff; }
.f2 .tag { position: absolute; top: -10px; right: -8px; background: #ffe14d; color: #3a2400; font: 700 10px var(--font-body); padding: 3px 7px; border-radius: 6px; transform: rotate(8deg); border: 2px solid #fff; }
@keyframes hop { 50% { transform: rotate(var(--r)) translateY(-6px); } }

/* 3 Portal dive */
.f3 { background: #07040f; display: grid; place-items: center; }
.f3 .ring { position: absolute; left: 50%; top: 50%; width: 30%; aspect-ratio: 1; border: 6px solid var(--c); border-radius: 22%; transform: translate(-50%, -50%) scale(0) rotate(0deg); box-shadow: 0 0 24px var(--c), inset 0 0 24px var(--c); animation: dive 4s cubic-bezier(.55, 0, .9, .5) infinite; animation-delay: var(--d); opacity: 0; }
@keyframes dive { 0% { transform: translate(-50%, -50%) scale(.05) rotate(0deg); opacity: 0; } 15% { opacity: 1; } 100% { transform: translate(-50%, -50%) scale(5) rotate(90deg); opacity: 0; } }
.f3 .core { position: relative; z-index: 2; text-align: center; color: #fff; }
.f3 .core small { display: block; font: 500 11px var(--font-mono); letter-spacing: .3em; opacity: .8; }
.f3 .core b { font-family: var(--font-display); font-weight: 400; font-size: clamp(26px, 8cqw, 54px); letter-spacing: .02em; text-shadow: 0 0 24px var(--exposure), 0 4px 0 #6a0f1d; }

/* 4 Pixel overworld */
.f4 canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
.f4 .ui { position: absolute; left: 4%; right: 4%; bottom: 6%; background: #10123a; border: 3px solid #fff; box-shadow: 0 0 0 3px #10123a; color: #fff; font: 9px/1.7 "Press Start 2P", monospace; padding: 8px 10px; }
.f4 .ui span { color: #ffe14d; }

/* 5 Poster */
.f5 { background: #ffe14d; }
.f5::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle, rgba(255,77,94,.55) 1.6px, transparent 2px) 0 0 / 10px 10px; -webkit-mask: linear-gradient(120deg, #000 10%, transparent 70%); mask: linear-gradient(120deg, #000 10%, transparent 70%); }
.f5 .burst { position: absolute; right: -8%; top: -14%; width: 55%; animation: spin 20s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.f5 .type { position: absolute; left: 6%; top: 10%; font-family: "Anton", var(--font-display); font-size: clamp(34px, 11cqw, 76px); line-height: .88; color: #16151a; text-transform: uppercase; transform: rotate(-4deg); }
.f5 .type em { font-style: normal; color: #fff; -webkit-text-stroke: 3px #16151a; paint-order: stroke fill; }
.f5 .st { position: absolute; font: 700 clamp(10px, 2.6cqw, 14px) var(--font-body); color: #fff; background: var(--c); border: 3px solid #16151a; border-radius: 999px; padding: 4px 12px; box-shadow: 3px 3px 0 #16151a; transform: rotate(var(--r)); animation: wob 3s ease-in-out infinite; animation-delay: var(--d); }
@keyframes wob { 50% { transform: rotate(calc(var(--r) * -1)) scale(1.05); } }

/* 6 Holo HUD */
.f6 { background: #030a12; color: #7ff3ff; font-family: var(--font-mono); }
.f6::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(127,243,255,.06) 0 1px, transparent 1px 3px); pointer-events: none; }
.f6 .radar { position: absolute; left: 50%; top: 52%; width: 62%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; border: 1px solid rgba(127,243,255,.5); background: repeating-radial-gradient(circle, transparent 0 18%, rgba(127,243,255,.25) 18% calc(18% + 1px)), conic-gradient(from 0deg, rgba(127,243,255,.45), transparent 18%); animation: sweep 4s linear infinite; }
@keyframes sweep { to { transform: translate(-50%, -50%) rotate(360deg); } }
.f6 .blip { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: 0 0 12px var(--c); transform: translate(-50%, -50%); }
.f6 .blip::after { content: attr(data-l); position: absolute; left: 14px; top: -3px; font-size: 10px; letter-spacing: .12em; color: var(--c); white-space: nowrap; }
.f6 .hd { position: absolute; top: 6%; left: 5%; right: 5%; display: flex; justify-content: space-between; font-size: 10px; letter-spacing: .2em; }
.f6 .ft { position: absolute; bottom: 6%; left: 5%; font-size: 10px; letter-spacing: .2em; }
.f6 .ft b { color: #fff; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } .f3 .ring { opacity: .7; transform: translate(-50%, -50%) scale(var(--s)); } }
</style>

<div class="wrap">
  <header>
    <h1>Six 2D directions for the hub</h1>
    <p>No 3D in any of these: just flat illustration, type and motion. Each frame shows a mood, not a finished design. Pick the ones that feel closest (a mix is fine too) and say what you'd change.</p>
  </header>

  <div class="grid">
    <figure>
      <div class="frame f1">
        <svg viewBox="0 0 400 250" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <defs>
            <linearGradient id="s1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a1c8f"/><stop offset=".55" stop-color="#c04ec9"/><stop offset="1" stop-color="#ffb37a"/></linearGradient>
          </defs>
          <rect width="400" height="250" fill="url(#s1)"/>
          <circle cx="300" cy="170" r="46" fill="#ffd98a" opacity=".9"/>
          <g class="drift-a" fill="#fff" opacity=".55"><ellipse cx="60" cy="60" rx="38" ry="10"/><ellipse cx="330" cy="40" rx="44" ry="11"/><ellipse cx="200" cy="96" rx="30" ry="8"/></g>
          <g transform="translate(0,-48)"><g class="drift-b">
            <g class="bob"><path d="M20 200 h70 l-14 22 -20 18 -22 -16z" fill="#5a2e7a"/><path d="M18 200 q36 -14 74 0z" fill="#ff4d5e"/></g>
            <g class="bob" style="animation-delay:-1s"><path d="M120 214 h60 l-12 18 -18 14 -18 -14z" fill="#5a2e7a"/><path d="M118 214 q32 -12 64 0z" fill="#ffad1f"/></g>
            <g class="bob" style="animation-delay:-2s"><path d="M240 224 h62 l-12 16 -20 12 -18 -12z" fill="#5a2e7a"/><path d="M238 224 q33 -12 66 0z" fill="#2fb8ff"/></g>
            <g class="bob" style="animation-delay:-3s"><path d="M330 206 h62 l-12 18 -20 14 -18 -14z" fill="#5a2e7a"/><path d="M328 206 q33 -12 66 0z" fill="#3ddc84"/></g>
          </g></g>
        </svg>
        <div class="logo">JERRY QIU<small>FOUR WORLDS</small></div>
        <div class="press">▶ PRESS ENTER</div>
      </div>
      <figcaption><b><span>01</span>Title screen</b><small>You arrive on a game title screen with a big chunky logo, floating worlds drifting past and "press enter". Enter drops you into the hub.</small></figcaption>
    </figure>

    <figure>
      <div class="frame f2">
        <div class="top"><span>CHOOSE A WORLD</span><span class="pill">★ 2 / 4 KEYS</span></div>
        <div class="cards">
          <div class="c" style="--c:var(--exposure);--r:-5deg;--d:0s"><svg viewBox="0 0 40 30" fill="#fff"><rect x="2" y="7" width="36" height="21" rx="4"/><rect x="12" y="2" width="12" height="7" rx="2"/><circle cx="20" cy="17" r="7" fill="var(--exposure)"/><circle cx="20" cy="17" r="4"/></svg><b>EXPOSURE</b><div class="bar" style="--p:100%"><i></i></div></div>
          <div class="c" style="--c:var(--resonance);--r:3deg;--d:-.6s"><span class="tag">NEW</span><svg viewBox="0 0 30 34" fill="#fff"><path d="M10 4 l18 -4 v24 a5 5 0 1 1 -3 -4.5 V8 L13 10.5 V28 a5 5 0 1 1 -3 -4.5z"/></svg><b>RESONANCE</b><div class="bar" style="--p:100%"><i></i></div></div>
          <div class="c" style="--c:var(--altitude);--r:-2deg;--d:-1.2s"><svg viewBox="0 0 40 30" fill="#fff"><path d="M2 16 l14 -2 8 -12 h4 l-4 12 10 -1 3 -5 h3 l-1 8 1 8 h-3 l-3 -5 -10 -1 4 12 h-4 l-8 -12 -14 -2z"/></svg><b>ALTITUDE</b><div class="bar" style="--p:30%"><i></i></div></div>
          <div class="c" style="--c:var(--forge);--r:5deg;--d:-1.8s"><svg viewBox="0 0 32 32" fill="#fff"><path d="M13 1h6l1 4 3 1.3 3.6-2.2 4.3 4.3-2.2 3.6L30 15l1 4h0v-6 6l-4 1-1.3 3 2.2 3.6-4.3 4.3-3.6-2.2L17 30l-1 2h-0 -3l-1-4-3-1.3-3.6 2.2-4.3-4.3 2.2-3.6L2 17 1 13l4-1 1.3-3L4.1 5.4 8.4 1.1 12 3.3 13 1z"/><circle cx="16" cy="16" r="5" fill="var(--forge)"/></svg><b>FORGE</b><div class="bar" style="--p:0%"><i></i></div></div>
        </div>
      </div>
      <figcaption><b><span>02</span>World select</b><small>An event lobby. Bouncy world cards with progress bars, "NEW" stickers, a key counter and a locked bonus world. It's the closest to the Roblox event UI.</small></figcaption>
    </figure>

    <figure>
      <div class="frame f3">
        <div class="ring" style="--c:var(--exposure);--d:0s;--s:.5"></div>
        <div class="ring" style="--c:var(--resonance);--d:-.8s;--s:1"></div>
        <div class="ring" style="--c:var(--altitude);--d:-1.6s;--s:1.6"></div>
        <div class="ring" style="--c:var(--forge);--d:-2.4s;--s:2.3"></div>
        <div class="ring" style="--c:var(--infinity);--d:-3.2s;--s:3"></div>
        <div class="core"><small>ENTERING</small><b>EXPOSURE</b></div>
      </div>
      <figcaption><b><span>03</span>Portal dive</b><small>The transition is the whole show. Choosing a world pulls you through rushing coloured gates in its colour, and that world's site opens on the far side.</small></figcaption>
    </figure>

    <figure>
      <div class="frame f4">
        <canvas width="160" height="100" id="pix" aria-hidden="true"></canvas>
        <div class="ui">▶ <span>EXPOSURE</span> · photography<br>2 of 4 keys found</div>
      </div>
      <figcaption><b><span>04</span>Pixel overworld</b><small>A 16-bit map like an old RPG. Walk a little sprite or move a cursor between world icons along dotted paths, with a dialogue box at the bottom.</small></figcaption>
    </figure>

    <figure>
      <div class="frame f5">
        <svg class="burst" viewBox="0 0 100 100" aria-hidden="true"><polygon fill="#ff4d5e" stroke="#16151a" stroke-width="2.5" points="50,2 58,30 86,14 70,40 98,50 70,60 86,86 58,70 50,98 42,70 14,86 30,60 2,50 30,40 14,14 42,30"/></svg>
        <div class="type">Four<br><em>worlds.</em><br>One door.</div>
        <span class="st" style="--c:var(--exposure);--r:-6deg;--d:0s;left:56%;top:56%">PHOTO ↗</span>
        <span class="st" style="--c:var(--resonance);--r:5deg;--d:-.7s;left:70%;top:72%">MUSIC ↗</span>
        <span class="st" style="--c:var(--altitude);--r:-4deg;--d:-1.4s;left:48%;top:80%">FLYING ↗</span>
        <span class="st" style="--c:var(--forge);--r:7deg;--d:-2.1s;left:74%;top:42%">MAKE ↗</span>
      </div>
      <figcaption><b><span>05</span>Sticker poster</b><small>A loud event poster: huge type, halftone, starbursts and sticker buttons that wobble. Feels like a launch campaign more than a game.</small></figcaption>
    </figure>

    <figure>
      <div class="frame f6">
        <div class="hd"><span>OASIS//JQ</span><span>SCANNING…</span></div>
        <div class="radar"></div>
        <span class="blip" style="--c:var(--exposure);left:34%;top:36%" data-l="EXPOSURE"></span>
        <span class="blip" style="--c:var(--resonance);left:60%;top:30%" data-l="RESONANCE"></span>
        <span class="blip" style="--c:var(--altitude);left:64%;top:66%" data-l="ALTITUDE"></span>
        <span class="blip" style="--c:var(--forge);left:38%;top:70%" data-l="FORGE"></span>
        <div class="ft">SIGNAL LOCK: <b>4 WORLDS</b> · 1 HIDDEN</div>
      </div>
      <figcaption><b><span>06</span>Holo scanner</b><small>The Ready Player One take: a flat neon HUD with a radar sweep finding the worlds and a hidden fifth signal. Cooler and calmer than the others.</small></figcaption>
    </figure>
  </div>
</div>

<script>
// 04: draw a tiny overworld and blink the cursor over Exposure.
(() => {
  const c = document.getElementById("pix"), x = c.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const worlds = [[30, 26, "#ff4d5e"], [78, 16, "#ffad1f"], [128, 30, "#2fb8ff"], [112, 58, "#3ddc84"]];
  const hub = [72, 46];
  function draw(t) {
    x.fillStyle = "#1e6fd9"; x.fillRect(0, 0, 160, 100);
    for (let i = 0; i < 40; i++) { x.fillStyle = (i + Math.floor(t / 400)) % 7 ? "#2a7fe8" : "#7fc0ff"; x.fillRect((i * 37) % 160, (i * 23) % 100, 2, 1); }
    const land = (cx, cy, w, h, col) => { x.fillStyle = "#e8d48a"; x.fillRect(cx - w / 2 - 1, cy - h / 2 - 1, w + 2, h + 2); x.fillStyle = col; x.fillRect(cx - w / 2, cy - h / 2, w, h); };
    land(hub[0], hub[1], 26, 16, "#4caf50");
    x.fillStyle = "#fff"; x.fillRect(hub[0] - 2, hub[1] - 7, 4, 8); x.fillStyle = "#b07cff"; x.fillRect(hub[0] - 1, hub[1] - 10, 2, 3);
    for (const [wx, wy, col] of worlds) {
      x.fillStyle = "#fff8";
      const steps = 14;
      for (let s = 1; s < steps; s += 2) x.fillRect(Math.round(hub[0] + (wx - hub[0]) * s / steps), Math.round(hub[1] + (wy - hub[1]) * s / steps), 1, 1);
      land(wx, wy, 16, 12, "#3f9b47");
      x.fillStyle = col; x.fillRect(wx - 4, wy - 4, 8, 8); x.fillStyle = "#fff"; x.fillRect(wx - 2, wy - 2, 4, 4);
    }
    if (reduce || Math.floor(t / 400) % 2) { const [wx, wy] = worlds[0]; x.fillStyle = "#ffe14d"; x.fillRect(wx - 9, wy - 8, 3, 1); x.fillRect(wx - 9, wy - 8, 1, 3); x.fillRect(wx + 6, wy - 8, 3, 1); x.fillRect(wx + 8, wy - 8, 1, 3); x.fillRect(wx - 9, wy + 7, 3, 1); x.fillRect(wx - 9, wy + 5, 1, 3); x.fillRect(wx + 6, wy + 7, 3, 1); x.fillRect(wx + 8, wy + 5, 1, 3); }
    if (!reduce) requestAnimationFrame(draw);
  }
  draw(0);
})();
</script>
