<title>Jerry Qiu Sky Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Hanken+Grotesk:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a full-window 3D world with a thin HUD on top: title top-left, keys top-right, island picker along the bottom. Single deliberate look per sky mode, set explicitly. */
:root {
  --ink: #0c0b1d;
  --paper: #ffffff;
  --glass: rgba(14, 12, 40, 0.58);
  --glass-line: rgba(255, 255, 255, 0.18);
  --gold: #ffd34d;
  --exposure: #ff5a6a;
  --resonance: #ffb02e;
  --altitude: #39c8ff;
  --forge: #4fe38f;
  --infinity: #c88bff;
  --font-display: "Lilita One", "Hanken Grotesk", system-ui, sans-serif;
  --font-body: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; background: var(--ink); }
body { margin: 0; color: var(--paper); font-family: var(--font-body); overflow: hidden; }
#world { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#world.drag { cursor: grabbing; }
.hud { position: fixed; inset: 0; pointer-events: none; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.hud > * { pointer-events: auto; }
.title { position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 2px; text-shadow: 0 2px 0 rgba(0,0,0,.35); }
.title h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(26px, 4.6vw, 46px); line-height: .95; letter-spacing: .01em; }
.title span { font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; opacity: .85; }
.keys { position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 8px; align-items: center; background: var(--glass); border: 1px solid var(--glass-line); border-radius: 999px; padding: 6px 12px 6px 8px; backdrop-filter: blur(10px); font-weight: 700; }
.keys .k { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; background: rgba(255,255,255,.08); border: 1px solid var(--glass-line); color: rgba(255,255,255,.35); }
.keys .k.got { background: var(--gold); color: #5a3b00; border-color: #fff3; box-shadow: 0 0 12px var(--gold); }
.tools { position: absolute; top: calc(58px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 6px; }
.chip { font: 600 12px var(--font-body); color: var(--paper); background: var(--glass); border: 1px solid var(--glass-line); border-radius: 999px; padding: 7px 12px; cursor: pointer; backdrop-filter: blur(10px); min-height: 34px; }
.chip:hover { border-color: rgba(255,255,255,.45); }
.dock { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: calc(100% - 32px); }
.isl { display: grid; gap: 1px; text-align: left; font: 600 13px var(--font-body); color: var(--paper); background: var(--glass); border: 1px solid var(--glass-line); border-left: 4px solid var(--c); border-radius: 12px; padding: 8px 12px; cursor: pointer; min-height: 44px; backdrop-filter: blur(10px); }
.isl small { font: 500 10px var(--font-mono); letter-spacing: .1em; text-transform: uppercase; opacity: .7; }
.isl[aria-current="true"] { background: color-mix(in srgb, var(--c) 30%, rgba(14,12,40,.7)); }
.isl[disabled] { opacity: .45; cursor: not-allowed; }
.hint { position: absolute; left: 50%; transform: translateX(-50%); top: calc(20px + env(safe-area-inset-top, 0px)); font: 500 12px var(--font-mono); letter-spacing: .06em; background: var(--glass); border: 1px solid var(--glass-line); border-radius: 999px; padding: 6px 12px; white-space: nowrap; backdrop-filter: blur(10px); max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis; }
.toast { position: absolute; left: 50%; top: 22%; transform: translate(-50%, -10px); font-family: var(--font-display); font-size: clamp(22px, 4vw, 38px); color: var(--gold); text-shadow: 0 3px 0 #7a4a00, 0 0 24px rgba(255,211,77,.6); opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; text-align: center; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.card { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); width: min(320px, calc(100% - 32px)); background: var(--glass); border: 1px solid var(--glass-line); border-top: 4px solid var(--c, #fff); border-radius: 14px; padding: 14px 16px; backdrop-filter: blur(12px); display: grid; gap: 6px; }
.card h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 28px; color: var(--c); letter-spacing: .01em; }
.card p { margin: 0; font-size: 14px; line-height: 1.45; opacity: .92; }
.card .meta { font: 500 11px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; opacity: .7; }
.card .go { justify-self: start; margin-top: 4px; font: 700 14px var(--font-body); color: var(--ink); background: var(--c); border: 0; border-radius: 10px; padding: 9px 14px; cursor: pointer; min-height: 40px; }
.warp { position: fixed; inset: 0; display: grid; place-content: center; text-align: center; gap: 10px; background: radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--c) 45%, transparent), var(--ink) 70%); z-index: 4; padding: 24px; }
.warp .big { font-family: var(--font-display); font-size: clamp(40px, 9vw, 96px); line-height: .9; color: #fff; text-shadow: 0 4px 0 color-mix(in srgb, var(--c) 60%, #000), 0 0 40px var(--c); }
.warp .sub { font: 500 13px var(--font-mono); letter-spacing: .14em; text-transform: uppercase; }
.warp p { max-width: 46ch; margin: 0 auto; opacity: .9; }
.warp .back { justify-self: center; margin-top: 8px; font: 700 15px var(--font-body); color: var(--ink); background: #fff; border: 0; border-radius: 12px; padding: 11px 18px; cursor: pointer; min-height: 44px; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.err { position: fixed; inset: 0; display: grid; place-content: center; text-align: center; padding: 24px; gap: 8px; }
@media (max-width: 1100px) { .hint { display: none; } }
@media (max-width: 640px) { .card { left: 16px; right: 16px; width: auto; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); } .hint { display: none; } .tools { top: calc(54px + env(safe-area-inset-top, 0px)); } }
</style>

<canvas id="world" aria-label="A 3D sky hub with floating islands. Use the island buttons at the bottom to travel."></canvas>

<div class="hud">
  <div class="title"><span>jerryqiu.com · sky hub prototype</span><h1>JERRY QIU</h1></div>
  <div class="keys" aria-live="polite"><span class="sr">Keys found</span><span class="k" data-k="exposure">★</span><span class="k" data-k="resonance">★</span><span class="k" data-k="altitude">★</span><span class="k" data-k="forge">★</span></div>
  <div class="tools"><button class="chip" id="sky">Sky: dusk</button><button class="chip" id="reset">Reset keys</button></div>
  <div class="hint" id="hint">Drag to look · scroll to zoom · click an island or a portal · find the gold key on each island</div>
  <div class="toast" id="toast">★ KEY FOUND</div>
  <div class="card" id="card" hidden></div>
  <nav class="dock" id="dock" aria-label="Islands"></nav>
</div>
<div class="warp" id="warp" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
if (!window.THREE) { document.body.insertAdjacentHTML("beforeend", '<div class="err"><h2>The 3D library did not load.</h2><p>Reload the page to try again.</p></div>'); return; }
const REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;
const T = THREE;

const ISLANDS = [
  { key: "hub", name: "The Plaza", what: "Hub", url: "jerryqiu.com", color: 0xffffff, css: "#ffffff", pos: [0, 0, 0], r: 15,
    blurb: "Where every visitor lands. Writing, About and Connect live in the buildings around the beacon." },
  { key: "exposure", name: "Exposure", what: "Photography", url: "photo.jerryqiu.com", color: 0xff5a6a, css: "#ff5a6a", pos: [-46, 6, -22], r: 11,
    blurb: "A giant camera on a cliff, prints drifting around it. Galleries, packages and the studio for clients." },
  { key: "resonance", name: "Resonance", what: "Music", url: "music.jerryqiu.com", color: 0xffb02e, css: "#ffb02e", pos: [-14, 13, -54], r: 10,
    blurb: "Speakers that breathe with the bass, notes floating up. Compositions, recordings and scores." },
  { key: "altitude", name: "Altitude", what: "Flying", url: "flying.jerryqiu.com", color: 0x39c8ff, css: "#39c8ff", pos: [26, 9, -48], r: 11,
    blurb: "A runway at the edge of the sky with a little plane circling. The log and the places I've flown." },
  { key: "forge", name: "Forge", what: "Make", url: "make.jerryqiu.com", color: 0x4fe38f, css: "#4fe38f", pos: [48, 3, -14], r: 10,
    blurb: "A workshop island: turning gears, sparks, a bench. The projects I build and what I learned." },
  { key: "infinity", name: "Island ∞", what: "Sealed", url: "???", color: 0xc88bff, css: "#c88bff", pos: [0, 42, -30], r: 8,
    blurb: "Sealed until all four keys are found. What waits here is up to you: a hidden piece of work, a note, a secret page." },
];
const WORLDS = ISLANDS.filter((i) => !["hub", "infinity"].includes(i.key));

/* ---------- keys (kept in this browser only) ---------- */
const got = new Set();
try { for (const k of JSON.parse(localStorage.getItem("hub-keys") || "[]")) got.add(k); } catch {}
const saveKeys = () => { try { localStorage.setItem("hub-keys", JSON.stringify([...got])); } catch {} };
const allKeys = () => WORLDS.every((w) => got.has(w.key));

/* ---------- renderer, scene, camera ---------- */
const canvas = document.getElementById("world");
const renderer = new T.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
renderer.outputEncoding = T.sRGBEncoding;
renderer.toneMapping = T.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = T.PCFSoftShadowMap;
const scene = new T.Scene();
const camera = new T.PerspectiveCamera(50, 1, 0.1, 2000);

const SKIES = {
  dusk: { top: 0x1b1450, mid: 0x7a4bb8, bot: 0xffa27a, fog: 0x8a5aa8, sun: 0xffd2a8, amb: 0x6a5aa0, stars: 0.6 },
  day: { top: 0x2f7cff, mid: 0x7cc4ff, bot: 0xfff1d6, fog: 0xbfe1ff, sun: 0xfff6e0, amb: 0x9ec6ff, stars: 0.0 },
  night: { top: 0x02030b, mid: 0x0e1240, bot: 0x2b1a5a, fog: 0x161a44, sun: 0x9fb4ff, amb: 0x2a2f6a, stars: 1.0 },
};
const skyU = { top: { value: new T.Color() }, mid: { value: new T.Color() }, bot: { value: new T.Color() }, stars: { value: 0 }, time: { value: 0 } };
const sky = new T.Mesh(new T.SphereGeometry(900, 32, 16), new T.ShaderMaterial({
  side: T.BackSide, depthWrite: false, uniforms: skyU,
  vertexShader: "varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }",
  fragmentShader: `uniform vec3 top; uniform vec3 mid; uniform vec3 bot; uniform float stars; uniform float time; varying vec3 vP;
    float h(vec3 p){ return fract(sin(dot(p, vec3(12.9898,78.233,45.164)))*43758.5453); }
    void main(){ float y = vP.y; vec3 c = y > 0.0 ? mix(mid, top, smoothstep(0.0, 0.7, y)) : mix(mid, bot, smoothstep(0.0, -0.5, y));
      vec3 g = floor(vP*260.0); float s = step(0.9975, h(g)) * smoothstep(-0.05, 0.4, y) * stars;
      s *= 0.6 + 0.4*sin(time*2.0 + h(g)*40.0);
      gl_FragColor = vec4(c + vec3(s), 1.0); }`,
}));
scene.add(sky);
scene.fog = new T.Fog(0x8a5aa8, 120, 420);
const hemi = new T.HemisphereLight(0xffffff, 0x444466, 0.7);
scene.add(hemi);
const sun = new T.DirectionalLight(0xffffff, 1.4);
sun.position.set(60, 120, 40);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -90, right: 90, top: 90, bottom: -90, near: 10, far: 400 });
scene.add(sun);
let skyName = "dusk";
function applySky(name) {
  skyName = name;
  const s = SKIES[name];
  skyU.top.value.setHex(s.top); skyU.mid.value.setHex(s.mid); skyU.bot.value.setHex(s.bot); skyU.stars.value = s.stars;
  scene.fog.color.setHex(s.fog); sun.color.setHex(s.sun); hemi.color.setHex(s.amb);
  document.getElementById("sky").textContent = `Sky: ${name}`;
}
applySky("dusk");

/* ---------- helpers ---------- */
const mat = (c, o = {}) => new T.MeshStandardMaterial({ color: c, flatShading: true, roughness: 0.85, metalness: 0.05, ...o });
const glow = (c) => new T.MeshBasicMaterial({ color: c, toneMapped: false });
function add(parent, geo, m, x = 0, y = 0, z = 0, cast = true) {
  const mesh = new T.Mesh(geo, m);
  mesh.position.set(x, y, z);
  mesh.castShadow = cast; mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}
function jitter(geo, amt, seed) {
  const p = geo.attributes.position; let s = seed;
  const rnd = () => ((s = (s * 9301 + 49297) % 233280) / 233280 - 0.5);
  for (let i = 0; i < p.count; i++) p.setXYZ(i, p.getX(i) + rnd() * amt, p.getY(i) + rnd() * amt * 0.6, p.getZ(i) + rnd() * amt);
  geo.computeVertexNormals();
  return geo;
}
function label(text, color, scale = 1) {
  const c = document.createElement("canvas"); c.width = 512; c.height = 128;
  const x = c.getContext("2d");
  x.font = "64px 'Lilita One', sans-serif"; x.textAlign = "center"; x.textBaseline = "middle";
  x.lineWidth = 12; x.strokeStyle = "rgba(10,8,30,.85)"; x.strokeText(text, 256, 66);
  x.fillStyle = color; x.fillText(text, 256, 64);
  const tex = new T.CanvasTexture(c); tex.encoding = T.sRGBEncoding;
  const sp = new T.Sprite(new T.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, fog: false }));
  sp.scale.set(16 * scale, 4 * scale, 1);
  return sp;
}

/* ---------- islands ---------- */
const clickables = []; // { mesh, kind, island }
const anim = []; // per-frame callbacks
const groups = {};

function islandBase(isl, grass, rock) {
  const g = new T.Group();
  g.position.set(...isl.pos);
  const top = add(g, jitter(new T.CylinderGeometry(isl.r, isl.r * 0.92, 3, 9, 1), 0.6, isl.r * 7), mat(grass), 0, 0, 0);
  add(g, jitter(new T.ConeGeometry(isl.r * 0.92, isl.r * 1.6, 9, 3), 1.2, isl.r * 13), mat(rock), 0, -1.5 - isl.r * 0.8, 0).rotation.x = Math.PI;
  // little floating rocks under the island
  for (let i = 0; i < 4; i++) {
    const a = i * 1.7 + isl.r;
    const rk = add(g, jitter(new T.DodecahedronGeometry(0.8 + (i % 3) * 0.5, 0), 0.3, i + 3), mat(rock), Math.cos(a) * isl.r * 0.9, -isl.r * 1.2 - i * 1.6, Math.sin(a) * isl.r * 0.9);
    const base = rk.position.y;
    anim.push((t) => { rk.position.y = base + Math.sin(t * 0.9 + i) * 0.5; rk.rotation.y = t * 0.3 + i; });
  }
  top.userData.island = isl;
  clickables.push({ mesh: top, kind: "island", island: isl });
  scene.add(g);
  groups[isl.key] = g;
  const lab = label(isl.name.toUpperCase(), isl.css, isl.key === "hub" ? 1.1 : 0.9);
  lab.position.set(0, isl.r * 0.9 + 9, 0);
  g.add(lab);
  // gentle bob
  const by = isl.pos[1];
  if (!REDUCE) anim.push((t) => { g.position.y = by + Math.sin(t * 0.5 + isl.r) * 0.6; });
  return g;
}

function tree(g, x, z, h, c) {
  add(g, new T.CylinderGeometry(0.25, 0.35, h * 0.4, 5), mat(0x6b4a2b), x, 1.5 + h * 0.2, z);
  add(g, new T.ConeGeometry(h * 0.35, h * 0.8, 6), mat(c), x, 1.5 + h * 0.75, z);
}

function portal(g, isl, x, y, z, ry = 0) {
  const p = new T.Group(); p.position.set(x, y, z); p.rotation.y = ry; g.add(p);
  const ringMat = new T.MeshStandardMaterial({ color: isl.color, emissive: isl.color, emissiveIntensity: 0.9, flatShading: true, roughness: 0.4 });
  add(p, new T.TorusGeometry(3.4, 0.45, 8, 28), ringMat, 0, 3.8, 0);
  add(p, new T.BoxGeometry(8.4, 0.6, 2.2), mat(0x3a3550), 0, 0.3, 0);
  const u = { time: { value: 0 }, c: { value: new T.Color(isl.color) } };
  const disc = add(p, new T.CircleGeometry(3.05, 48), new T.ShaderMaterial({
    uniforms: u, transparent: true, side: T.DoubleSide,
    vertexShader: "varying vec2 vU; void main(){ vU = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }",
    fragmentShader: `uniform float time; uniform vec3 c; varying vec2 vU;
      void main(){ vec2 p = vU-0.5; float r = length(p)*2.0; float a = atan(p.y,p.x);
        float sw = sin(a*5.0 + r*14.0 - time*4.0)*0.5+0.5; float core = smoothstep(1.0, 0.0, r);
        vec3 col = mix(c, vec3(1.0), pow(sw*core, 3.0)); gl_FragColor = vec4(col*(0.7+0.6*sw), 0.85*core + 0.15); }`,
  }), 0, 3.8, 0, false);
  anim.push((t) => { u.time.value = t; });
  // sparkles rising from the portal
  const n = 40, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) pos.set([(Math.random() - 0.5) * 6, Math.random() * 7, (Math.random() - 0.5) * 1.5], i * 3);
  const geo = new T.BufferGeometry(); geo.setAttribute("position", new T.BufferAttribute(pos, 3));
  const pts = new T.Points(geo, new T.PointsMaterial({ color: isl.color, size: 0.25, transparent: true, opacity: 0.9 }));
  p.add(pts);
  if (!REDUCE) anim.push((t, dt) => { const a = geo.attributes.position; for (let i = 0; i < n; i++) { let yy = a.getY(i) + dt * (0.8 + (i % 5) * 0.2); if (yy > 8) yy = 0; a.setY(i, yy); } a.needsUpdate = true; });
  clickables.push({ mesh: disc, kind: "portal", island: isl });
  return p;
}

function keyStar(g, isl, x, y, z) {
  const shape = new T.Shape();
  for (let i = 0; i < 10; i++) { const r = i % 2 ? 0.6 : 1.4, a = (i / 10) * Math.PI * 2 + Math.PI / 2; i ? shape.lineTo(Math.cos(a) * r, Math.sin(a) * r) : shape.moveTo(Math.cos(a) * r, Math.sin(a) * r); }
  const m = add(g, new T.ExtrudeGeometry(shape, { depth: 0.4, bevelEnabled: true, bevelSize: 0.12, bevelThickness: 0.12, bevelSegments: 1 }), new T.MeshStandardMaterial({ color: 0xffd34d, emissive: 0xffb000, emissiveIntensity: 0.6, metalness: 0.6, roughness: 0.3 }), x, y, z);
  const halo = add(g, new T.SphereGeometry(2.1, 16, 12), new T.MeshBasicMaterial({ color: 0xffd34d, transparent: true, opacity: 0.12, depthWrite: false }), x, y, z, false);
  anim.push((t) => { m.rotation.y = t * 2; m.position.y = y + Math.sin(t * 2) * 0.4; halo.position.y = m.position.y; halo.scale.setScalar(1 + Math.sin(t * 3) * 0.08); });
  const entry = { mesh: m, kind: "key", island: isl, halo };
  clickables.push(entry);
  const sync = () => { m.visible = halo.visible = !got.has(isl.key); };
  sync(); entry.sync = sync;
  return entry;
}

/* Hub: the plaza with a beacon and three small buildings for Writing, About, Connect */
(function buildHub() {
  const isl = ISLANDS[0];
  const g = islandBase(isl, 0x9be37a, 0x7a6a8a);
  add(g, new T.CylinderGeometry(8, 8, 0.4, 24), mat(0xf2e7ff), 0, 1.7, 0);
  // beacon
  add(g, new T.CylinderGeometry(1.2, 1.8, 10, 8), mat(0xffffff), 0, 6.9, 0);
  const crystal = add(g, new T.OctahedronGeometry(2.2, 0), new T.MeshStandardMaterial({ color: 0xc8b6ff, emissive: 0x8a6aff, emissiveIntensity: 0.9, flatShading: true }), 0, 14.5, 0);
  const beam = add(g, new T.CylinderGeometry(0.5, 1.6, 120, 12, 1, true), new T.MeshBasicMaterial({ color: 0xc8b6ff, transparent: true, opacity: 0.18, depthWrite: false, side: T.DoubleSide }), 0, 75, 0, false);
  anim.push((t) => { crystal.rotation.y = t; crystal.position.y = 14.5 + Math.sin(t * 1.5) * 0.4; beam.material.opacity = 0.12 + 0.06 * Math.sin(t * 2); });
  const houses = [["WRITING", 0x5aa0ff, -10, 3], ["ABOUT", 0xff8ac2, 2, 10.5], ["CONNECT", 0xffc85a, 10.5, 2]];
  for (const [name, c, x, z] of houses) {
    add(g, new T.BoxGeometry(4, 3.4, 4), mat(0xfff7ee), x, 3.4, z);
    add(g, new T.ConeGeometry(3.4, 2.4, 4), mat(c), x, 6.3, z).rotation.y = Math.PI / 4;
    const l = label(name, "#ffffff", 0.5); l.position.set(x, 9, z); g.add(l);
  }
  for (let i = 0; i < 7; i++) { const a = i * 0.9 + 0.4; tree(g, Math.cos(a) * 12.5, Math.sin(a) * 12.5, 3 + (i % 3), 0x3fae5a); }
  // light bridges from the plaza to each world
  for (const w of WORLDS) {
    const from = new T.Vector3(...isl.pos).add(new T.Vector3(0, 2, 0));
    const to = new T.Vector3(...w.pos).add(new T.Vector3(0, 2, 0));
    const mid = from.clone().lerp(to, 0.5).add(new T.Vector3(0, 8, 0));
    const curve = new T.QuadraticBezierCurve3(from, mid, to);
    const tube = new T.Mesh(new T.TubeGeometry(curve, 48, 0.18, 6), new T.MeshBasicMaterial({ color: w.color, transparent: true, opacity: 0.55 }));
    scene.add(tube);
    // a pulse travelling along each bridge
    const dot = new T.Mesh(new T.SphereGeometry(0.6, 10, 8), glow(w.color));
    scene.add(dot);
    const off = Math.random();
    anim.push((t) => { dot.position.copy(curve.getPoint(((t * 0.18 + off) % 1))); });
  }
})();

/* Exposure: a giant camera, drifting prints, a flash */
(function buildExposure() {
  const isl = ISLANDS[1];
  const g = islandBase(isl, 0xff9f8a, 0x6a4a5a);
  const cam = new T.Group(); cam.position.set(-1, 1.5, 1); cam.rotation.y = 0.5; g.add(cam);
  add(cam, new T.BoxGeometry(7, 4.6, 3.4), mat(0x22202c), 0, 3.4, 0);
  add(cam, new T.BoxGeometry(2.4, 1.2, 2), mat(0x22202c), -1.8, 6.2, 0);
  add(cam, new T.CylinderGeometry(1.7, 1.9, 2.4, 20), mat(0x15141c), 0.6, 3.4, 2.4).rotation.x = Math.PI / 2;
  add(cam, new T.CylinderGeometry(1.25, 1.25, 0.2, 20), new T.MeshStandardMaterial({ color: 0x5a7cff, metalness: 0.9, roughness: 0.1 }), 0.6, 3.4, 3.65).rotation.x = Math.PI / 2;
  add(cam, new T.BoxGeometry(1.3, 0.5, 0.5), mat(0xff5a6a), 2.6, 6, 0);
  const flash = add(cam, new T.BoxGeometry(1, 0.6, 0.3), glow(0xffffff), 2.4, 5.2, 1.75, false);
  const flashLight = new T.PointLight(0xffffff, 0, 30); flashLight.position.set(2.4, 5.2, 3); cam.add(flashLight);
  anim.push((t) => { const f = Math.max(0, Math.sin(t * 0.8) - 0.97) * 30; flash.material.color.setScalar(0.4 + f * 0.6); flashLight.intensity = f * 4; });
  // prints orbiting
  const tints = [0xffe0d6, 0xd6f0ff, 0xfff3c4, 0xe6d6ff, 0xd8ffe6];
  tints.forEach((c, i) => {
    const pr = new T.Group(); g.add(pr);
    add(pr, new T.BoxGeometry(2.6, 3.2, 0.12), mat(0xffffff), 0, 0, 0);
    add(pr, new T.PlaneGeometry(2.1, 2.2), mat(c), 0, 0.3, 0.07, false);
    anim.push((t) => { const a = t * 0.35 + i * 1.256; pr.position.set(Math.cos(a) * 9, 7 + Math.sin(t + i) * 1.2, Math.sin(a) * 9); pr.rotation.y = -a + Math.PI / 2; pr.rotation.z = Math.sin(t + i) * 0.15; });
  });
  for (let i = 0; i < 4; i++) tree(g, Math.cos(i * 1.5 + 2) * 8.6, Math.sin(i * 1.5 + 2) * 8.6, 2.6, 0xd2495a);
  portal(g, isl, 5, 1.5, -5, -0.6);
  keyStar(g, isl, -7, 5, -4);
})();

/* Resonance: breathing speakers, equaliser bars, floating notes */
(function buildResonance() {
  const isl = ISLANDS[2];
  const g = islandBase(isl, 0xffd27a, 0x6a5040);
  const spk = [];
  for (const [x, z, s] of [[-4, 1, 1.2], [4, 1, 1.2], [0, -3, 1.5]]) {
    const b = new T.Group(); b.position.set(x, 1.5, z); g.add(b);
    add(b, new T.BoxGeometry(3 * s, 4.4 * s, 2.6 * s), mat(0x2a2230), 0, 2.2 * s, 0);
    const cone = add(b, new T.CylinderGeometry(1.05 * s, 1.05 * s, 0.3, 18), mat(0xffb02e, { emissive: 0x6a3a00, emissiveIntensity: 0.5 }), 0, 1.6 * s, 1.35 * s);
    cone.rotation.x = Math.PI / 2;
    add(b, new T.CylinderGeometry(0.5 * s, 0.5 * s, 0.3, 14), mat(0xffb02e), 0, 3.4 * s, 1.35 * s).rotation.x = Math.PI / 2;
    spk.push(cone);
  }
  anim.push((t) => { const beat = Math.pow(Math.max(0, Math.sin(t * 5.2)), 6); spk.forEach((c) => { c.scale.set(1 + beat * 0.25, 1, 1 + beat * 0.25); }); });
  const bars = [];
  for (let i = 0; i < 9; i++) bars.push(add(g, new T.BoxGeometry(0.7, 1, 0.7), glow(i % 2 ? 0xffd27a : 0xffb02e), -4 + i, 1.7, 6.2));
  anim.push((t) => bars.forEach((b, i) => { const h = 0.6 + 3 * Math.abs(Math.sin(t * 3 + i * 0.7) * Math.sin(t * 1.3 + i)); b.scale.y = h; b.position.y = 1.7 + h / 2; }));
  for (let i = 0; i < 6; i++) {
    const n = new T.Group(); g.add(n);
    add(n, new T.SphereGeometry(0.55, 10, 8), glow(0xfff1c8), 0, 0, 0, false);
    add(n, new T.BoxGeometry(0.12, 1.6, 0.12), glow(0xfff1c8), 0.5, 0.8, 0, false);
    anim.push((t) => { const p = (t * 0.15 + i / 6) % 1; n.position.set(Math.sin(i * 2 + t * 0.3) * 6, 3 + p * 14, Math.cos(i * 2) * 5); n.scale.setScalar(Math.sin(p * Math.PI)); });
  }
  portal(g, isl, 6, 1.5, -3.5, -1.0);
  keyStar(g, isl, -6.5, 4.5, -4);
})();

/* Altitude: runway with lights, a plane circling, clouds */
(function buildAltitude() {
  const isl = ISLANDS[3];
  const g = islandBase(isl, 0xa8e6ff, 0x506a80);
  add(g, new T.BoxGeometry(18, 0.2, 3.6), mat(0x3b4150), 0, 1.6, 0).rotation.y = 0.35;
  const lights = [];
  for (let i = 0; i < 8; i++) {
    const x = -8 + i * 2.3;
    for (const side of [-1, 1]) {
      const l = add(g, new T.SphereGeometry(0.22, 8, 6), glow(0x39c8ff), 0, 1.85, 0, false);
      l.position.set(x * Math.cos(0.35) + side * 2 * Math.sin(0.35), 1.85, -x * Math.sin(0.35) + side * 2 * Math.cos(0.35));
      lights.push([l, i]);
    }
  }
  anim.push((t) => lights.forEach(([l, i]) => { const on = (Math.floor(t * 8) % 8) === i; l.material.color.setHex(on ? 0xffffff : 0x39c8ff); l.scale.setScalar(on ? 1.8 : 1); }));
  // tower
  add(g, new T.CylinderGeometry(0.9, 1.2, 7, 8), mat(0xf4f7ff), -6, 5, 5);
  add(g, new T.CylinderGeometry(1.8, 1.4, 1.6, 8), mat(0x39c8ff, { emissive: 0x0a4a6a, emissiveIntensity: 0.6 }), -6, 9.2, 5);
  // plane
  const plane = new T.Group(); scene.add(plane);
  add(plane, new T.CylinderGeometry(0.5, 0.35, 4.4, 8), mat(0xffffff), 0, 0, 0).rotation.z = Math.PI / 2;
  add(plane, new T.BoxGeometry(1.2, 0.12, 6), mat(0xffffff), 0.2, 0, 0);
  add(plane, new T.BoxGeometry(0.8, 1.2, 0.12), mat(0x39c8ff), -2, 0.6, 0);
  add(plane, new T.BoxGeometry(0.6, 0.1, 2.2), mat(0xffffff), -2, 0.1, 0);
  const prop = add(plane, new T.BoxGeometry(0.1, 1.6, 0.18), mat(0x333333), 2.3, 0, 0);
  const c0 = new T.Vector3(...isl.pos);
  anim.push((t) => { const a = t * 0.45; plane.position.set(c0.x + Math.cos(a) * 18, c0.y + 12 + Math.sin(a * 2) * 2, c0.z + Math.sin(a) * 18); plane.rotation.set(0, -a - Math.PI / 2 + Math.PI, -0.35); prop.rotation.x = t * 40; });
  // clouds
  for (let i = 0; i < 5; i++) {
    const cl = new T.Group(); g.add(cl);
    for (let k = 0; k < 4; k++) add(cl, new T.SphereGeometry(1.6 + (k % 2), 8, 6), mat(0xffffff, { roughness: 1 }), k * 1.7, (k % 2) * 0.6, 0, false);
    const a = i * 1.3, rr = 13 + (i % 2) * 4;
    anim.push((t) => { cl.position.set(Math.cos(a + t * 0.05) * rr, 4 + (i % 3) * 2.5, Math.sin(a + t * 0.05) * rr); });
  }
  portal(g, isl, 5.5, 1.5, 5, -2.4);
  keyStar(g, isl, 6, 6, -5);
})();

/* Forge: gears, an anvil, sparks */
(function buildForge() {
  const isl = ISLANDS[4];
  const g = islandBase(isl, 0x8be0a8, 0x4a5a50);
  add(g, new T.BoxGeometry(9, 4, 6), mat(0x6b5a4a), -1, 3.5, -1);
  add(g, new T.BoxGeometry(10, 0.6, 7), mat(0x4fe38f), -1, 5.8, -1);
  add(g, new T.CylinderGeometry(0.8, 0.8, 5, 8), mat(0x3a3a3a), 2.5, 8, -2);
  const gears = [];
  function gear(x, y, z, r, c, dir) {
    const gg = new T.Group(); gg.position.set(x, y, z); g.add(gg);
    add(gg, new T.CylinderGeometry(r, r, 0.6, 18), mat(c, { metalness: 0.5 }), 0, 0, 0).rotation.x = Math.PI / 2;
    for (let i = 0; i < 10; i++) { const a = (i / 10) * Math.PI * 2; add(gg, new T.BoxGeometry(r * 0.35, r * 0.35, 0.6), mat(c, { metalness: 0.5 }), Math.cos(a) * r, Math.sin(a) * r, 0).rotation.z = a; }
    gears.push([gg, dir]);
  }
  gear(-3, 9.6, 2.6, 2.2, 0x4fe38f, 1); gear(0.4, 8.6, 2.6, 1.5, 0xcfd6d0, -1.5);
  anim.push((t) => gears.forEach(([gg, d]) => { gg.rotation.z = t * 0.8 * d; }));
  add(g, new T.BoxGeometry(2.6, 1.2, 1.4), mat(0x2c2c32), 5, 2.4, 3.5);
  add(g, new T.BoxGeometry(1.2, 1.2, 1), mat(0x2c2c32), 5, 1.6, 3.5);
  const n = 70, pos = new Float32Array(n * 3), vel = [];
  for (let i = 0; i < n; i++) { vel.push(new T.Vector3()); pos.set([5, 3, 3.5], i * 3); }
  const geo = new T.BufferGeometry(); geo.setAttribute("position", new T.BufferAttribute(pos, 3));
  g.add(new T.Points(geo, new T.PointsMaterial({ color: 0xffd34d, size: 0.3 })));
  const life = new Float32Array(n);
  anim.push((t, dt) => { const a = geo.attributes.position; for (let i = 0; i < n; i++) { life[i] -= dt; if (life[i] <= 0) { life[i] = 0.5 + Math.random() * 0.8; a.setXYZ(i, 5, 3.1, 3.5); vel[i].set((Math.random() - 0.5) * 6, 3 + Math.random() * 5, (Math.random() - 0.5) * 6); } vel[i].y -= 12 * dt; a.setXYZ(i, a.getX(i) + vel[i].x * dt, a.getY(i) + vel[i].y * dt, a.getZ(i) + vel[i].z * dt); } a.needsUpdate = true; });
  portal(g, isl, -5, 1.5, 5, 0.9);
  keyStar(g, isl, 6, 5, -5);
})();

/* Island ∞: sealed until all keys are found */
let infinityState = null;
(function buildInfinity() {
  const isl = ISLANDS[5];
  const g = islandBase(isl, 0xd6b6ff, 0x5a4a7a);
  const temple = new T.Group(); g.add(temple);
  for (let i = 0; i < 6; i++) { const a = (i / 6) * Math.PI * 2; add(temple, new T.CylinderGeometry(0.5, 0.5, 6, 8), mat(0xffffff), Math.cos(a) * 5, 4.5, Math.sin(a) * 5); }
  add(temple, new T.CylinderGeometry(6, 6, 0.6, 6), mat(0xf4ecff), 0, 7.7, 0);
  const orb = add(temple, new T.IcosahedronGeometry(2, 1), new T.MeshStandardMaterial({ color: 0xc88bff, emissive: 0x8a4aff, emissiveIntensity: 1, flatShading: true }), 0, 4, 0);
  const shield = add(g, new T.SphereGeometry(13, 32, 20), new T.MeshBasicMaterial({ color: 0xc88bff, transparent: true, opacity: 0.16, wireframe: true }), 0, 2, 0, false);
  const p = portal(g, isl, 0, 1.5, 6.5, 0);
  anim.push((t) => { orb.rotation.y = t * 0.6; orb.rotation.x = t * 0.3; shield.rotation.y = t * 0.1; });
  infinityState = { shield, portal: p, sync() { const open = allKeys(); shield.visible = !open; p.visible = open; } };
  infinityState.sync();
})();

/* drifting clouds around the whole world */
for (let i = 0; i < 18; i++) {
  const cl = new T.Group(); scene.add(cl);
  const s = 2 + (i % 4);
  for (let k = 0; k < 5; k++) add(cl, new T.SphereGeometry(s * (0.7 + (k % 3) * 0.25), 7, 5), mat(0xffffff, { roughness: 1, transparent: true, opacity: 0.9 }), k * s * 0.9, (k % 2) * s * 0.4, (k % 3) * s * 0.3, false);
  const a = (i / 18) * Math.PI * 2, rr = 90 + (i % 5) * 25, y = -30 + (i % 7) * 12;
  anim.push((t) => { cl.position.set(Math.cos(a + t * 0.01) * rr, y, Math.sin(a + t * 0.01) * rr - 30); });
}

/* ---------- camera rig: orbit around a focus, fly between islands ---------- */
const rig = { focus: new T.Vector3(0, 6, -26), yaw: -0.2, pitch: 0.38, dist: 130, tFocus: new T.Vector3(0, 6, -26), tDist: 130, tYaw: -0.2, tPitch: 0.38 };
let current = null;
function focusIsland(isl) {
  current = isl;
  rig.tFocus.set(isl.pos[0], isl.pos[1] + 4, isl.pos[2]);
  rig.tDist = isl.key === "hub" ? 52 : 40;
  rig.tPitch = 0.32;
  showCard(isl);
  renderDock();
}
function overview() {
  current = null;
  rig.tFocus.set(0, 6, -26); rig.tDist = 130; rig.tPitch = 0.38;
  document.getElementById("card").hidden = true;
  renderDock();
}

/* ---------- HUD ---------- */
const dock = document.getElementById("dock");
function renderDock() {
  dock.innerHTML = "";
  const all = document.createElement("button");
  all.className = "isl"; all.style.setProperty("--c", "#ffffff");
  all.innerHTML = "<small>View</small>All islands";
  all.setAttribute("aria-current", String(current === null));
  all.addEventListener("click", overview);
  dock.append(all);
  for (const isl of ISLANDS) {
    const b = document.createElement("button");
    b.className = "isl"; b.style.setProperty("--c", isl.css);
    const sealed = isl.key === "infinity" && !allKeys();
    b.innerHTML = `<small>${sealed ? "sealed · 4 keys" : isl.what}</small>${isl.name}`;
    b.setAttribute("aria-current", String(current === isl));
    b.addEventListener("click", () => focusIsland(isl));
    dock.append(b);
  }
}
function showCard(isl) {
  const card = document.getElementById("card");
  card.style.setProperty("--c", isl.css);
  const sealed = isl.key === "infinity" && !allKeys();
  const hasKey = WORLDS.some((w) => w.key === isl.key);
  card.innerHTML = `<span class="meta">${isl.what} · ${isl.url}</span><h2>${isl.name}</h2><p>${isl.blurb}</p>
    ${hasKey ? `<span class="meta">${got.has(isl.key) ? "★ key found" : "☆ a gold key is hidden on this island"}</span>` : ""}
    ${isl.key === "hub" ? "" : sealed ? `<span class="meta">Find all four keys to open it (${WORLDS.filter((w) => got.has(w.key)).length}/4)</span>` : `<button class="go" id="go">Enter the portal</button>`}`;
  card.hidden = false;
  card.querySelector("#go")?.addEventListener("click", () => enterPortal(isl));
}
function syncKeys() {
  document.querySelectorAll(".keys .k").forEach((k) => k.classList.toggle("got", got.has(k.dataset.k)));
  clickables.forEach((c) => c.sync?.());
  infinityState.sync();
  renderDock();
  if (current) showCard(current);
}
const toast = document.getElementById("toast");
function say(text) { toast.textContent = text; toast.classList.add("on"); clearTimeout(say.t); say.t = setTimeout(() => toast.classList.remove("on"), 1600); }
function collect(isl) {
  if (got.has(isl.key)) return;
  got.add(isl.key); saveKeys();
  say(allKeys() ? "★ ALL KEYS! ISLAND ∞ IS OPEN" : `★ KEY FOUND · ${got.size}/4`);
  syncKeys();
  if (allKeys()) setTimeout(() => focusIsland(ISLANDS[5]), 900);
}
document.getElementById("reset").addEventListener("click", () => { got.clear(); saveKeys(); syncKeys(); say("KEYS RESET"); });
const order = ["dusk", "day", "night"];
document.getElementById("sky").addEventListener("click", () => applySky(order[(order.indexOf(skyName) + 1) % order.length]));

/* ---------- portal warp ---------- */
const warpEl = document.getElementById("warp");
let warping = null;
function enterPortal(isl) {
  if (isl.key === "infinity" && !allKeys()) return;
  document.getElementById("card").hidden = true;
  if (REDUCE) return arrive(isl);
  warping = { isl, t: 0, from: rig.focus.clone() };
}
function arrive(isl) {
  warping = null;
  warpEl.style.setProperty("--c", isl.css);
  warpEl.innerHTML = `<span class="sub">You stepped through · ${isl.url}</span><span class="big">${isl.name}</span>
    <p>${isl.key === "infinity" ? "The secret island. In the real site this holds whatever you decide: a hidden project, a message, a playable easter egg." : `In the real site, ${isl.what.toLowerCase()} opens here and plays its arrival in the same colour, so the jump feels continuous. A small portal on that site brings you back to this island.`}</p>
    <button class="back" id="back">Back to the sky hub</button>`;
  warpEl.hidden = false;
  const back = warpEl.querySelector("#back");
  back.focus();
  back.addEventListener("click", () => { warpEl.hidden = true; focusIsland(isl); });
}

/* ---------- input ---------- */
const ray = new T.Raycaster(), mouse = new T.Vector2();
let drag = null, moved = 0;
canvas.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, y: e.clientY }; moved = 0; canvas.setPointerCapture(e.pointerId); canvas.classList.add("drag"); });
canvas.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  moved += Math.abs(dx) + Math.abs(dy);
  rig.tYaw -= dx * 0.005; rig.tPitch = Math.max(0.05, Math.min(1.25, rig.tPitch + dy * 0.004));
  drag = { x: e.clientX, y: e.clientY };
});
canvas.addEventListener("pointerup", (e) => {
  canvas.classList.remove("drag");
  const wasClick = moved < 6; drag = null;
  if (!wasClick || warping) return;
  const r = canvas.getBoundingClientRect();
  mouse.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hits = ray.intersectObjects(clickables.filter((c) => c.mesh.visible && c.mesh.parent?.visible !== false).map((c) => c.mesh), false);
  if (!hits.length) return;
  const hit = clickables.find((c) => c.mesh === hits[0].object);
  if (hit.kind === "key") collect(hit.island);
  else if (hit.kind === "portal") current === hit.island ? enterPortal(hit.island) : focusIsland(hit.island);
  else focusIsland(hit.island);
});
canvas.addEventListener("wheel", (e) => { e.preventDefault(); rig.tDist = Math.max(18, Math.min(220, rig.tDist * (1 + Math.sign(e.deltaY) * 0.1))); }, { passive: false });
addEventListener("keydown", (e) => {
  if (!warpEl.hidden && e.key === "Escape") warpEl.querySelector("#back")?.click();
  if (e.target.closest("button")) return;
  if (e.key === "ArrowLeft") rig.tYaw += 0.15;
  if (e.key === "ArrowRight") rig.tYaw -= 0.15;
  if (e.key === "ArrowUp") rig.tDist = Math.max(18, rig.tDist * 0.9);
  if (e.key === "ArrowDown") rig.tDist = Math.min(220, rig.tDist * 1.1);
});

/* ---------- loop ---------- */
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener("resize", resize); resize();
let last = performance.now(), time = 0;
function tick(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; time += REDUCE ? 0 : dt;
  skyU.time.value = time;
  for (const f of anim) f(REDUCE ? 2 : time, REDUCE ? 0 : dt);
  const k = REDUCE ? 1 : Math.min(1, dt * 2.6);
  if (warping) {
    // fly into the portal, then flash
    warping.t += dt;
    const p = Math.min(1, warping.t / 1.4);
    const target = new T.Vector3(...warping.isl.pos).add(new T.Vector3(0, 6, 0));
    rig.focus.lerp(target, 0.08); rig.dist += (2 - rig.dist) * 0.06; camera.fov = 50 + p * 45; camera.updateProjectionMatrix();
    if (p >= 1) { camera.fov = 50; camera.updateProjectionMatrix(); rig.dist = rig.tDist; arrive(warping.isl); }
  } else {
    rig.focus.lerp(rig.tFocus, k); rig.dist += (rig.tDist - rig.dist) * k;
    if (!drag && current === null && !REDUCE) rig.tYaw -= dt * 0.03;
  }
  rig.yaw += (rig.tYaw - rig.yaw) * k; rig.pitch += (rig.tPitch - rig.pitch) * k;
  camera.position.set(rig.focus.x + Math.sin(rig.yaw) * Math.cos(rig.pitch) * rig.dist, rig.focus.y + Math.sin(rig.pitch) * rig.dist, rig.focus.z + Math.cos(rig.yaw) * Math.cos(rig.pitch) * rig.dist);
  camera.lookAt(rig.focus);
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
renderDock();
syncKeys();
// opening shot: swoop in from high above
if (!REDUCE) { rig.dist = 320; rig.pitch = 1.1; rig.focus.set(0, 40, -26); }
requestAnimationFrame(tick);
})();
</script>
